<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindBloom 🌱 - Student Mental Wellness Tracker</title>
  <meta name="description" content="MindBloom helps students track their mood, journal their thoughts, and build healthy habits through gamified wellness challenges." />
  <meta name="theme-color" content="#6C63FF" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6C63FF;
      --primary-light: #9B93FF;
      --primary-dark: #4B44CC;
      --secondary: #FF6B9D;
      --success: #4ADE80;
      --warning: #FBBF24;
      --danger: #F87171;
      --bg: #0F0E1A;
      --bg2: #1A1828;
      --bg3: #242236;
      --card: #1E1C2E;
      --card2: #262440;
      --text: #F0EFFF;
      --text2: #9B99CC;
      --text3: #6B69A0;
      --border: #2E2B4A;
      --gradient: linear-gradient(135deg, #6C63FF 0%, #FF6B9D 100%);
      --gradient2: linear-gradient(135deg, #4ADE80 0%, #06B6D4 100%);
      --glow: 0 0 20px rgba(108, 99, 255, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      min-height: 100vh;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    .float { animation: float 3s ease-in-out infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .bounce { animation: bounce 1s ease-in-out infinite; }

    /* Loading */
    .loading-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 1.5rem;
      background: linear-gradient(135deg, var(--bg) 0%, #1a0a2e 100%);
    }
    .loading-logo { font-size: 4rem; animation: float 2s ease-in-out infinite; }
    .loading-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--primary-light); }
    .loading-bar { width: 200px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
    .loading-bar-fill { height: 100%; width: 40%; background: var(--gradient); border-radius: 2px; animation: shimmer 1.5s ease-in-out infinite; background-size: 200% auto; }

    /* Auth Screen */
    .auth-container {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1rem; background: linear-gradient(135deg, #0F0E1A 0%, #1A0A2E 50%, #0A1A2E 100%);
      position: relative; overflow: hidden;
    }
    .auth-bg-orb {
      position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; opacity: 0.3;
    }
    .auth-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      padding: 2.5rem; width: 100%; max-width: 420px; position: relative; z-index: 1;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5), var(--glow);
    }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo-icon { font-size: 3.5rem; display: block; margin-bottom: 0.5rem; animation: float 3s ease-in-out infinite; }
    .auth-logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-logo-sub { color: var(--text2); font-size: 0.875rem; margin-top: 0.25rem; }
    .auth-tabs { display: flex; margin-bottom: 1.5rem; background: var(--bg2); border-radius: 12px; padding: 4px; }
    .auth-tab { flex: 1; padding: 0.6rem; border: none; background: transparent; color: var(--text2); cursor: pointer; border-radius: 8px; font-weight: 500; font-size: 0.875rem; transition: all 0.2s; }
    .auth-tab.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(108, 99, 255, 0.3); }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; color: var(--text2); font-size: 0.8rem; font-weight: 500; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-input { 
      width: 100%; padding: 0.75rem 1rem; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 0.9rem; outline: none; transition: all 0.2s;
      font-family: inherit;
    }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
    .btn { 
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem; border: none; border-radius: 12px; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; transition: all 0.2s; font-family: inherit; text-decoration: none;
    }
    .btn-primary { background: var(--gradient); color: white; width: 100%; font-size: 1rem; padding: 0.875rem; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(108, 99, 255, 0.4); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary-light); }
    .btn-ghost { background: transparent; color: var(--text2); }
    .btn-ghost:hover { color: var(--text); background: var(--bg2); }
    .btn-danger { background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid rgba(248,113,113,0.2); }
    .error-msg { color: var(--danger); font-size: 0.8rem; margin-top: 0.75rem; text-align: center; padding: 0.5rem; background: rgba(248,113,113,0.1); border-radius: 8px; }
    .success-msg { color: var(--success); font-size: 0.8rem; margin-top: 0.75rem; text-align: center; }

    /* App Layout */
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; background: var(--bg2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 1.5rem; position: fixed; height: 100vh;
      left: 0; top: 0; z-index: 100; transition: transform 0.3s;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
    .sidebar-logo-icon { font-size: 1.8rem; }
    .sidebar-logo-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.2rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-section { margin-bottom: 1.5rem; }
    .nav-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 0.5rem; padding: 0 0.5rem; }
    .nav-item {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.75rem;
      border-radius: 12px; cursor: pointer; transition: all 0.2s; color: var(--text2);
      font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; border: none; background: transparent; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item.active { background: rgba(108, 99, 255, 0.15); color: var(--primary-light); border-left: 3px solid var(--primary); }
    .nav-item-icon { font-size: 1.1rem; width: 20px; text-align: center; }
    .sidebar-user { margin-top: auto; padding: 1rem; background: var(--bg3); border-radius: 16px; border: 1px solid var(--border); }
    .sidebar-user-info { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
    .user-name { font-weight: 600; font-size: 0.875rem; }
    .user-level { color: var(--primary-light); font-size: 0.75rem; font-weight: 500; }
    .xp-bar-container { }
    .xp-bar-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text3); margin-bottom: 0.3rem; }
    .xp-bar { height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: var(--gradient); border-radius: 3px; transition: width 0.5s ease; }

    /* Main Content */
    .main-content { flex: 1; margin-left: 240px; padding: 2rem; max-width: calc(100% - 240px); }
    .page-header { margin-bottom: 2rem; }
    .page-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
    .page-subtitle { color: var(--text2); font-size: 0.9rem; }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 1.5rem; transition: all 0.2s;
    }
    .card:hover { border-color: rgba(108, 99, 255, 0.3); }
    .card-title { font-weight: 600; font-size: 0.875rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }

    /* Dashboard Grid */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; transition: all 0.2s; }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-color: rgba(108, 99, 255, 0.3); }
    .stat-icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
    .stat-value { font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 0.2rem; }
    .stat-label { color: var(--text2); font-size: 0.75rem; font-weight: 500; }
    .stat-gradient { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-green { background: var(--gradient2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Mood Logger */
    .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; margin: 1.5rem 0; }
    .mood-btn {
      aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2px solid var(--border); border-radius: 16px; cursor: pointer; transition: all 0.2s;
      background: var(--bg2); font-size: 1.8rem; gap: 0.3rem;
    }
    .mood-btn:hover { transform: scale(1.1); border-color: var(--primary); background: rgba(108, 99, 255, 0.1); }
    .mood-btn.selected { border-color: var(--primary); background: rgba(108, 99, 255, 0.2); box-shadow: var(--glow); transform: scale(1.1); }
    .mood-btn-label { font-size: 0.6rem; color: var(--text2); font-weight: 500; text-align: center; }
    .mood-score { font-size: 0.65rem; color: var(--text3); }
    .activities-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .activity-chip {
      padding: 0.4rem 0.875rem; border: 1px solid var(--border); border-radius: 50px;
      font-size: 0.8rem; cursor: pointer; transition: all 0.2s; background: var(--bg2);
    }
    .activity-chip:hover { border-color: var(--primary); color: var(--primary-light); }
    .activity-chip.selected { background: rgba(108, 99, 255, 0.2); border-color: var(--primary); color: var(--primary-light); }
    .energy-slider { width: 100%; accent-color: var(--primary); }

    /* Mood history */
    .mood-entry-item { 
      display: flex; align-items: center; gap: 1rem; padding: 0.875rem; 
      background: var(--bg2); border-radius: 12px; margin-bottom: 0.5rem; transition: all 0.2s;
    }
    .mood-entry-item:hover { background: var(--bg3); }
    .mood-emoji-big { font-size: 2rem; flex-shrink: 0; }
    .mood-entry-info { flex: 1; }
    .mood-entry-label { font-weight: 600; font-size: 0.9rem; }
    .mood-entry-note { color: var(--text2); font-size: 0.8rem; margin-top: 0.2rem; }
    .mood-entry-date { color: var(--text3); font-size: 0.75rem; }
    .mood-score-badge { 
      width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; background: var(--gradient); color: white; flex-shrink: 0;
    }

    /* Chart (simple bar chart) */
    .mini-chart { display: flex; align-items: flex-end; gap: 0.35rem; height: 80px; margin: 1rem 0; }
    .chart-bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
    .chart-bar { width: 100%; border-radius: 6px 6px 0 0; background: var(--gradient); transition: height 0.5s ease; min-height: 4px; }
    .chart-label { font-size: 0.6rem; color: var(--text3); white-space: nowrap; }

    /* Journal */
    .journal-entry-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; margin-bottom: 0.75rem; cursor: pointer; transition: all 0.2s; }
    .journal-entry-card:hover { border-color: rgba(108, 99, 255, 0.3); transform: translateY(-2px); }
    .journal-entry-title { font-weight: 600; margin-bottom: 0.5rem; }
    .journal-entry-preview { color: var(--text2); font-size: 0.85rem; line-height: 1.5; margin-bottom: 0.75rem; }
    .journal-entry-meta { display: flex; gap: 1rem; font-size: 0.75rem; color: var(--text3); }
    .mood-tag { display: inline-flex; padding: 0.25rem 0.6rem; background: rgba(108,99,255,0.15); border-radius: 50px; font-size: 0.75rem; color: var(--primary-light); border: 1px solid rgba(108,99,255,0.2); }
    .journal-editor { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; }
    textarea.form-input { resize: vertical; min-height: 150px; line-height: 1.6; }

    /* Challenges */
    .challenge-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; transition: all 0.2s; }
    .challenge-card:hover { transform: translateY(-3px); border-color: rgba(108, 99, 255, 0.3); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    .challenge-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .challenge-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.4rem; }
    .challenge-desc { color: var(--text2); font-size: 0.82rem; line-height: 1.5; margin-bottom: 1rem; }
    .challenge-meta { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 50px; font-size: 0.7rem; font-weight: 600; }
    .badge-easy { background: rgba(74, 222, 128, 0.15); color: #4ADE80; border: 1px solid rgba(74,222,128,0.2); }
    .badge-medium { background: rgba(251, 191, 36, 0.15); color: #FBBF24; border: 1px solid rgba(251,191,36,0.2); }
    .badge-hard { background: rgba(248, 113, 113, 0.15); color: #F87171; border: 1px solid rgba(248,113,113,0.2); }
    .badge-xp { background: rgba(108, 99, 255, 0.15); color: var(--primary-light); border: 1px solid rgba(108,99,255,0.2); }
    .challenge-progress { margin-bottom: 1rem; }
    .progress-bar { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--gradient2); border-radius: 4px; transition: width 0.5s ease; }
    .progress-text { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text3); margin-bottom: 0.4rem; }
    .challenges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }

    /* Breathing exercise */
    .breathing-container { text-align: center; padding: 2rem; }
    .breathing-circle {
      width: 200px; height: 200px; border-radius: 50%; margin: 2rem auto;
      background: var(--gradient); display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 1.2rem; font-weight: 700; color: white; transition: all 2s ease;
      box-shadow: 0 0 40px rgba(108, 99, 255, 0.5);
    }
    .breathing-circle.inhale { transform: scale(1.3); }
    .breathing-circle.exhale { transform: scale(0.8); background: linear-gradient(135deg, #4ADE80, #06B6D4); }
    .breathing-circle.hold { transform: scale(1.1); }
    .breathing-phase { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem; }
    .breathing-count { font-size: 3rem; font-weight: 900; line-height: 1; }
    .breathing-timer { font-size: 0.9rem; color: var(--text2); margin-top: 1rem; }

    /* Toasts */
    .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1.25rem;
      background: var(--card2); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4); max-width: 320px; animation: slideIn 0.3s ease;
      font-size: 0.875rem; font-weight: 500;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.info { border-left: 4px solid var(--primary); }
    .toast-icon { font-size: 1.2rem; }
    
    /* Mobile menu */
    .mobile-menu-btn {
      display: none; position: fixed; top: 1rem; left: 1rem; z-index: 200;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.6rem; font-size: 1.2rem; cursor: pointer; color: var(--text);
    }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 99; }
    
    /* Today's mood widget */
    .today-mood-widget { background: var(--gradient); border-radius: 20px; padding: 1.5rem; color: white; position: relative; overflow: hidden; }
    .today-mood-widget::before { content: ''; position: absolute; right: -20px; top: -20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1); }
    .today-mood-widget::after { content: ''; position: absolute; right: 30px; bottom: -30px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.08); }
    .widget-emoji { font-size: 3.5rem; margin-bottom: 0.5rem; }
    .widget-label { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .widget-sub { opacity: 0.8; font-size: 0.85rem; }
    .widget-score { position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%); font-family: 'Space Grotesk', sans-serif; font-size: 4rem; font-weight: 900; opacity: 0.3; }
    
    /* Streak display */
    .streak-card { background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%); border-radius: 16px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; }
    .streak-flame { font-size: 2rem; animation: bounce 1s ease-in-out infinite; }
    .streak-count { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 800; color: white; line-height: 1; }
    .streak-label { color: rgba(255,255,255,0.85); font-size: 0.8rem; }

    /* Empty states */
    .empty-state { text-align: center; padding: 3rem 1rem; }
    .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.6; }
    .empty-state-text { color: var(--text2); font-size: 0.95rem; }
    .empty-state-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }

    /* Section header */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .section-title { font-size: 1.1rem; font-weight: 700; }
    
    /* Grid layouts */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
    
    /* Spinner */
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.active { display: block; }
      .main-content { margin-left: 0; max-width: 100%; padding: 1rem; padding-top: 4rem; }
      .mobile-menu-btn { display: flex; align-items: center; }
      .two-col, .three-col { grid-template-columns: 1fr; }
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .mood-grid { grid-template-columns: repeat(5, 1fr); }
    }
    @media (max-width: 480px) {
      .dashboard-grid { grid-template-columns: 1fr 1fr; }
      .mood-grid { grid-template-columns: repeat(5, 1fr); }
      .mood-btn { font-size: 1.4rem; }
      .challenges-grid { grid-template-columns: 1fr; }
    }
    
    /* Mood colors */
    .mood-1, .mood-2 { color: #F87171; }
    .mood-3, .mood-4 { color: #FBBF24; }
    .mood-5 { color: #94A3B8; }
    .mood-6, .mood-7 { color: #4ADE80; }
    .mood-8, .mood-9, .mood-10 { color: #6C63FF; }
    
    /* Tab component */
    .tabs { display: flex; gap: 0.25rem; background: var(--bg2); border-radius: 12px; padding: 4px; margin-bottom: 1.5rem; width: fit-content; }
    .tab { padding: 0.5rem 1.25rem; border-radius: 8px; border: none; background: transparent; color: var(--text2); cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: all 0.2s; font-family: inherit; }
    .tab.active { background: var(--card); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 2rem; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; animation: fadeIn 0.2s ease; }
    .modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; }

    /* Leaderboard */
    .leaderboard-item { display: flex; align-items: center; gap: 1rem; padding: 0.875rem; border-radius: 12px; margin-bottom: 0.5rem; background: var(--bg2); transition: all 0.2s; }
    .leaderboard-item.is-me { background: rgba(108, 99, 255, 0.15); border: 1px solid rgba(108,99,255,0.3); }
    .leaderboard-rank { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 800; width: 30px; text-align: center; }
    .rank-1 { color: #FFD700; }
    .rank-2 { color: #C0C0C0; }
    .rank-3 { color: #CD7F32; }
    .leaderboard-info { flex: 1; }
    .leaderboard-name { font-weight: 600; font-size: 0.9rem; }
    .leaderboard-stats { color: var(--text2); font-size: 0.75rem; }
    .leaderboard-xp { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--primary-light); font-size: 0.875rem; }
    
    /* Scrollable history */
    .scrollable { max-height: 400px; overflow-y: auto; padding-right: 0.25rem; }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <div class="loading-logo">🌱</div>
      <div class="loading-text">MindBloom</div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      <div style="color: var(--text3); font-size: 0.8rem;">Loading your wellness journey...</div>
    </div>
  </div>

  <script>
  // ============================================================
  // MindBloom - Complete Frontend Application
  // ============================================================
  
  const API_BASE = '/api';
  
  // ---- State Management ----
  const state = {
    token: localStorage.getItem('mb_token') || null,
    user: null,
    currentPage: 'dashboard',
    toasts: [],
    dashboard: null,
    moods: [],
    todayMood: null,
    journal: [],
    challenges: [],
    leaderboard: [],
    sidebarOpen: false,
  };
  
  // ---- API Helper ----
  async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
    
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { ...headers, ...(options.headers || {}) }
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || data.errors?.[0]?.msg || 'Request failed');
    return data;
  }
  
  // ---- Toast Notifications ----
  function showToast(message, type = 'info', icon = null) {
    const icons = { success: '✅', error: '❌', info: '🌱' };
    const id = Date.now();
    const toast = { id, message, type, icon: icon || icons[type] };
    state.toasts.push(toast);
    renderToasts();
    setTimeout(() => {
      state.toasts = state.toasts.filter(t => t.id !== id);
      renderToasts();
    }, 3500);
  }
  
  function renderToasts() {
    let container = document.querySelector('.toast-container');
    if (!container) {
      container = document.createElement('div');
      container.className = 'toast-container';
      document.body.appendChild(container);
    }
    container.innerHTML = state.toasts.map(t => `
      <div class="toast ${t.type}">
        <span class="toast-icon">${t.icon}</span>
        <span>${t.message}</span>
      </div>
    `).join('');
  }
  
  // ---- Auth Functions ----
  async function login(email, password) {
    const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem('mb_token', data.token);
    showToast(data.message, 'success', '👋');
    initApp();
  }
  
  async function register(username, email, password) {
    const data = await api('/auth/register', { method: 'POST', body: JSON.stringify({ username, email, password }) });
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem('mb_token', data.token);
    showToast(data.message, 'success', '🌱');
    initApp();
  }
  
  function logout() {
    state.token = null;
    state.user = null;
    localStorage.removeItem('mb_token');
    showToast('See you next time! 🌱', 'info');
    renderAuth();
  }
  
  // ---- Data Fetching ----
  async function fetchDashboard() {
    state.dashboard = await api('/stats/dashboard');
    state.user = state.dashboard.user;
  }
  
  async function fetchMoods() {
    const data = await api('/moods?limit=30');
    state.moods = data.entries;
  }
  
  async function fetchTodayMood() {
    state.todayMood = await api('/moods/today');
  }
  
  async function fetchJournal() {
    const data = await api('/journal?limit=20');
    state.journal = data.entries;
  }
  
  async function fetchChallenges() {
    state.challenges = await api('/challenges');
  }
  
  async function fetchLeaderboard() {
    state.leaderboard = await api('/stats/leaderboard');
  }
  
  async function logMood(score, note, activities, energyLevel) {
    const data = await api('/moods', { method: 'POST', body: JSON.stringify({ mood_score: score, note, activities, energy_level: energyLevel }) });
    showToast(data.message, 'success', '📊');
    state.todayMood = data.entry;
    await fetchDashboard();
    await fetchMoods();
    renderApp();
  }
  
  async function saveJournal(title, content, moodTag, id = null) {
    if (id) {
      const data = await api(`/journal/${id}`, { method: 'PUT', body: JSON.stringify({ title, content, mood_tag: moodTag }) });
      showToast('Journal updated! ✍️', 'success');
    } else {
      const data = await api('/journal', { method: 'POST', body: JSON.stringify({ title, content, mood_tag: moodTag }) });
      showToast(data.message, 'success', '✍️');
    }
    await fetchJournal();
    renderApp();
  }
  
  async function deleteJournal(id) {
    await api(`/journal/${id}`, { method: 'DELETE' });
    showToast('Entry deleted', 'info', '🗑️');
    await fetchJournal();
    renderApp();
  }
  
  async function joinChallenge(challengeId) {
    const data = await api(`/challenges/${challengeId}/join`, { method: 'POST' });
    showToast(data.message, 'success', '💪');
    await fetchChallenges();
    renderApp();
  }
  
  async function updateChallengeProgress(challengeId) {
    const data = await api(`/challenges/${challengeId}/progress`, { method: 'POST', body: JSON.stringify({ increment: 1 }) });
    showToast(data.message, data.completed ? 'success' : 'info', data.completed ? '🎉' : '💪');
    await fetchChallenges();
    await fetchDashboard();
    renderApp();
  }

  // ---- Helper Functions ----
  function formatDate(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 7) return `${diff} days ago`;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  
  function getDayName(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short' });
  }
  
  function getMoodClass(score) {
    if (score <= 2) return 'mood-1';
    if (score <= 4) return 'mood-3';
    if (score <= 5) return 'mood-5';
    if (score <= 7) return 'mood-6';
    return 'mood-8';
  }
  
  function getLevelTitle(level) {
    const titles = ['Seedling', 'Sprout', 'Sapling', 'Tree', 'Ancient Oak', 'Forest Guardian'];
    return titles[Math.min(level - 1, titles.length - 1)];
  }
  
  function getAvatarEmoji(avatar) {
    const avatars = { sprout: '🌱', flower: '🌸', tree: '🌳', star: '⭐', moon: '🌙', sun: '☀️', rainbow: '🌈', butterfly: '🦋' };
    return avatars[avatar] || '🌱';
  }
  
  // ---- Render Functions ----
  
  function renderAuth() {
    document.getElementById('root').innerHTML = `
      <div class="auth-container">
        <div class="auth-bg-orb" style="width:400px;height:400px;background:#6C63FF;top:-100px;left:-150px;"></div>
        <div class="auth-bg-orb" style="width:300px;height:300px;background:#FF6B9D;bottom:-100px;right:-100px;"></div>
        <div class="auth-box fade-in">
          <div class="auth-logo">
            <span class="auth-logo-icon">🌱</span>
            <div class="auth-logo-text">MindBloom</div>
            <div class="auth-logo-sub">Your mental wellness companion for students</div>
          </div>
          <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Create Account</button>
          </div>
          <div id="auth-form-container"></div>
        </div>
      </div>
    `;
    renderAuthForm('login');
  }
  
  function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1)));
    renderAuthForm(tab);
  }
  
  function renderAuthForm(type) {
    const container = document.getElementById('auth-form-container');
    if (type === 'login') {
      container.innerHTML = `
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" type="email" id="login-email" placeholder="your@email.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <div id="auth-error" class="error-msg" style="display:none"></div>
          <button class="btn btn-primary" type="submit" id="login-btn">
            <span>Sign In</span> <span>🌱</span>
          </button>
          <p style="text-align:center; margin-top:1rem; color:var(--text3); font-size:0.8rem;">
            No account? <a href="#" onclick="switchAuthTab('register')" style="color:var(--primary-light)">Create one free</a>
          </p>
        </form>
      `;
    } else {
      container.innerHTML = `
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input class="form-input" type="text" id="reg-username" placeholder="coolbloom123" required minlength="3" maxlength="30" autocomplete="username">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" type="email" id="reg-email" placeholder="your@email.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" id="reg-password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
          </div>
          <div id="auth-error" class="error-msg" style="display:none"></div>
          <button class="btn btn-primary" type="submit" id="reg-btn">
            <span>Start My Journey</span> <span>🌱</span>
          </button>
          <p style="text-align:center; margin-top:1rem; color:var(--text3); font-size:0.8rem;">
            Already have an account? <a href="#" onclick="switchAuthTab('login')" style="color:var(--primary-light)">Sign in</a>
          </p>
        </form>
      `;
    }
  }
  
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('auth-error');
    btn.innerHTML = '<div class="spinner"></div>';
    btn.disabled = true;
    errEl.style.display = 'none';
    try {
      await login(document.getElementById('login-email').value, document.getElementById('login-password').value);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.innerHTML = '<span>Sign In</span> <span>🌱</span>';
      btn.disabled = false;
    }
  }
  
  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('reg-btn');
    const errEl = document.getElementById('auth-error');
    btn.innerHTML = '<div class="spinner"></div>';
    btn.disabled = true;
    errEl.style.display = 'none';
    try {
      await register(document.getElementById('reg-username').value, document.getElementById('reg-email').value, document.getElementById('reg-password').value);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.innerHTML = '<span>Start My Journey</span> <span>🌱</span>';
      btn.disabled = false;
    }
  }
  
  function renderSidebar() {
    const navItems = [
      { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
      { id: 'mood', icon: '😊', label: 'Mood Log' },
      { id: 'journal', icon: '📔', label: 'Journal' },
      { id: 'challenges', icon: '🎯', label: 'Challenges' },
      { id: 'breathe', icon: '🧘', label: 'Breathe' },
      { id: 'stats', icon: '📊', label: 'Analytics' },
    ];
    
    const xpForCurrentLevel = ((state.user?.level || 1) - 1) * 200;
    const xpForNextLevel = (state.user?.level || 1) * 200;
    const levelProg = Math.max(0, Math.min(100, ((state.user?.xp || 0) - xpForCurrentLevel) / (xpForNextLevel - xpForCurrentLevel) * 100));
    
    return `
      <div class="sidebar ${state.sidebarOpen ? 'open' : ''}" id="sidebar">
        <div class="sidebar-logo">
          <span class="sidebar-logo-icon">🌱</span>
          <span class="sidebar-logo-text">MindBloom</span>
        </div>
        <div class="nav-section">
          <div class="nav-label">Navigation</div>
          ${navItems.map(item => `
            <button class="nav-item ${state.currentPage === item.id ? 'active' : ''}" onclick="navigate('${item.id}')">
              <span class="nav-item-icon">${item.icon}</span>
              <span>${item.label}</span>
            </button>
          `).join('')}
        </div>
        <div class="nav-section">
          <div class="nav-label">Community</div>
          <button class="nav-item ${state.currentPage === 'leaderboard' ? 'active' : ''}" onclick="navigate('leaderboard')">
            <span class="nav-item-icon">🏆</span><span>Leaderboard</span>
          </button>
        </div>
        <div class="sidebar-user">
          <div class="sidebar-user-info">
            <div class="avatar">${getAvatarEmoji(state.user?.avatar)}</div>
            <div>
              <div class="user-name">${state.user?.username || 'User'}</div>
              <div class="user-level">Lv.${state.user?.level || 1} ${getLevelTitle(state.user?.level || 1)}</div>
            </div>
          </div>
          <div class="xp-bar-container">
            <div class="xp-bar-header">
              <span>${state.user?.xp || 0} XP</span>
              <span>Next: ${xpForNextLevel} XP</span>
            </div>
            <div class="xp-bar"><div class="xp-bar-fill" style="width:${levelProg}%"></div></div>
          </div>
          <button class="btn btn-ghost" onclick="logout()" style="width:100%;margin-top:0.75rem;font-size:0.8rem">
            🚪 Sign Out
          </button>
        </div>
      </div>
      <div class="sidebar-overlay ${state.sidebarOpen ? 'active' : ''}" onclick="toggleSidebar()"></div>
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
    `;
  }
  
  function toggleSidebar() {
    state.sidebarOpen = !state.sidebarOpen;
    document.getElementById('sidebar').classList.toggle('open', state.sidebarOpen);
    document.querySelector('.sidebar-overlay').classList.toggle('active', state.sidebarOpen);
  }
  
  function renderApp() {
    const pages = {
      dashboard: renderDashboard,
      mood: renderMoodPage,
      journal: renderJournalPage,
      challenges: renderChallengesPage,
      breathe: renderBreathePage,
      stats: renderStatsPage,
      leaderboard: renderLeaderboard,
    };
    
    const pageRender = pages[state.currentPage] || renderDashboard;
    
    document.getElementById('root').innerHTML = `
      <div class="app-layout">
        ${renderSidebar()}
        <div class="main-content fade-in" id="main-content">
          ${pageRender()}
        </div>
      </div>
    `;
  }
  
  // ---- Dashboard Page ----
  function renderDashboard() {
    const d = state.dashboard;
    if (!d) return '<div style="text-align:center;padding:3rem">Loading... 🌱</div>';
    
    const todayMood = state.todayMood;
    const stats = d.stats;
    
    return `
      <div class="page-header">
        <h1 class="page-title">Good ${getGreeting()}, ${state.user?.username}! ${getMoodGreetingEmoji(stats.weekly_avg_mood)}</h1>
        <p class="page-subtitle">${getTodayDate()} • ${stats.streak > 0 ? `🔥 ${stats.streak} day streak!` : 'Start your streak today!'}</p>
      </div>
      
      ${todayMood ? `
        <div class="today-mood-widget" style="margin-bottom:1.5rem">
          <div class="widget-emoji">${todayMood.mood_emoji}</div>
          <div class="widget-label">You're feeling ${todayMood.mood_label} today</div>
          <div class="widget-sub">${todayMood.note || 'Logged at ' + new Date(todayMood.created_at).toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit'})}</div>
          <div class="widget-score">${todayMood.mood_score}</div>
        </div>
      ` : `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:gap">
          <div>
            <div style="font-size:1.1rem;font-weight:700;margin-bottom:0.25rem">How are you feeling today?</div>
            <div style="color:var(--text2);font-size:0.875rem">Log your first mood of the day!</div>
          </div>
          <button class="btn btn-primary" onclick="navigate('mood')" style="width:auto;padding:0.75rem 1.25rem">Log Mood 😊</button>
        </div>
      `}
      
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-icon">🔥</div>
          <div class="stat-value stat-gradient">${stats.streak}</div>
          <div class="stat-label">Day Streak</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">😊</div>
          <div class="stat-value stat-green">${stats.weekly_avg_mood || '–'}</div>
          <div class="stat-label">Avg Mood (7d)</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✍️</div>
          <div class="stat-value stat-gradient">${stats.total_journal_entries}</div>
          <div class="stat-label">Journal Entries</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🎯</div>
          <div class="stat-value stat-green">${stats.completed_challenges}</div>
          <div class="stat-label">Challenges Done</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🧘</div>
          <div class="stat-value stat-gradient">${stats.mindfulness_minutes}</div>
          <div class="stat-label">Mindful Minutes</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⚡</div>
          <div class="stat-value stat-green">${stats.xp}</div>
          <div class="stat-label">Total XP</div>
        </div>
      </div>
      
      <div class="two-col" style="gap:1.25rem">
        <div class="card">
          <div class="section-header">
            <span class="section-title">📈 Mood This Week</span>
            <button class="btn btn-ghost" onclick="navigate('stats')" style="font-size:0.8rem;padding:0.3rem 0.75rem">Full Stats</button>
          </div>
          ${renderMiniChart(d.mood_trend)}
        </div>
        <div class="card">
          <div class="section-header">
            <span class="section-title">🎯 Active Challenges</span>
            <button class="btn btn-ghost" onclick="navigate('challenges')" style="font-size:0.8rem;padding:0.3rem 0.75rem">View All</button>
          </div>
          ${d.active_challenges.length ? d.active_challenges.map(c => `
            <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem">
              <span style="font-size:1.5rem">${c.icon}</span>
              <div style="flex:1">
                <div style="font-size:0.85rem;font-weight:600;margin-bottom:0.3rem">${c.title}</div>
                <div class="progress-bar"><div class="progress-fill" style="width:${(c.progress/c.duration_days)*100}%"></div></div>
                <div style="font-size:0.7rem;color:var(--text3);margin-top:0.2rem">${c.progress}/${c.duration_days} days</div>
              </div>
            </div>
          `).join('') : `
            <div class="empty-state" style="padding:1.5rem">
              <div class="empty-state-icon">🎯</div>
              <div class="empty-state-text">No active challenges yet!</div>
              <button class="btn btn-secondary" onclick="navigate('challenges')" style="margin-top:1rem;font-size:0.8rem">Find Challenges</button>
            </div>
          `}
        </div>
      </div>
      
      ${state.moods.length > 0 ? `
        <div class="card" style="margin-top:1.25rem">
          <div class="section-header">
            <span class="section-title">📋 Recent Mood Log</span>
            <button class="btn btn-ghost" onclick="navigate('mood')" style="font-size:0.8rem;padding:0.3rem 0.75rem">Log Mood</button>
          </div>
          ${state.moods.slice(0, 5).map(m => renderMoodEntry(m)).join('')}
        </div>
      ` : ''}
      
      <div style="background:var(--gradient);border-radius:20px;padding:1.5rem;margin-top:1.25rem;position:relative;overflow:hidden">
        <div style="position:relative;z-index:1">
          <div style="font-size:1.1rem;font-weight:700;color:white;margin-bottom:0.5rem">💡 Daily Wellness Tip</div>
          <div style="color:rgba(255,255,255,0.9);font-size:0.9rem;line-height:1.6">${getDailyTip()}</div>
        </div>
        <div style="position:absolute;right:-20px;top:-20px;font-size:8rem;opacity:0.08">💭</div>
      </div>
    `;
  }
  
  function renderMiniChart(trendData) {
    if (!trendData || trendData.length === 0) {
      return '<div class="empty-state" style="padding:1rem"><div class="empty-state-text">Log moods to see your trend!</div></div>';
    }
    const maxMood = 10;
    return `
      <div class="mini-chart">
        ${trendData.map(d => `
          <div class="chart-bar-group">

  const BREATHING_PATTERNS = {
    '4-7-8': { inhale: 4, hold: 7, exhale: 8, label: '4-7-8 Relaxing Breath', desc: 'Inhale 4s, hold 7s, exhale 8s' },
    'box': { inhale: 4, hold: 4, exhale: 4, label: 'Box Breathing', desc: 'Equal 4-count in, hold, out, hold' },

            `).join('')}
          </div>
        </div>
      </div>
    `;
  }
  
  function selectBreathing(type) {
    stopBreathing();
    breathingType = type;
    renderApp();
  }
  
  let breathingRunning = false;
  let sessionTimer = null;
  
  function startBreathing() {
    if (breathingRunning) return;
    breathingRunning = true;
    breathingSessionStart = Date.now();
    breathingSession = 0;
    
    document.getElementById('start-breath-btn').style.display = 'none';
    document.getElementById('stop-breath-btn').style.display = 'inline-flex';
    
    sessionTimer = setInterval(() => {
      breathingSession++;
      const el = document.getElementById('breath-timer');
      if (el) el.textContent = `Session: ${breathingSession}s`;
    }, 1000);
    
    runBreathCycle();
  }
  
  async function runBreathCycle() {
    const pattern = BREATHING_PATTERNS[breathingType];
    
    const phases = [
      { name: 'Inhale', class: 'inhale', duration: pattern.inhale, emoji: '😮‍💨' },
      ...(pattern.hold > 0 ? [{ name: 'Hold', class: 'hold', duration: pattern.hold, emoji: '🤐' }] : []),
      { name: 'Exhale', class: 'exhale', duration: pattern.exhale, emoji: '😌' },
    ];
    
    while (breathingRunning) {
      for (const phase of phases) {
        if (!breathingRunning) break;
        const circle = document.getElementById('breathing-circle');
        const phaseEl = document.getElementById('breath-phase');
        const countEl = document.getElementById('breath-count');
        if (!circle) return;
        
        circle.className = `breathing-circle ${phase.class}`;
        if (phaseEl) phaseEl.textContent = phase.name;
        
        for (let i = phase.duration; i >= 1; i--) {
          if (!breathingRunning) break;
          if (countEl) countEl.textContent = i;
          await sleep(1000);
        }
      }
    }
  }
  
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  
  async function stopBreathing() {
    breathingRunning = false;
    clearInterval(sessionTimer);
    
    const startBtn = document.getElementById('start-breath-btn');
    const stopBtn = document.getElementById('stop-breath-btn');
    if (startBtn) startBtn.style.display = 'inline-flex';
    if (stopBtn) stopBtn.style.display = 'none';
    
    const circle = document.getElementById('breathing-circle');
    if (circle) { circle.className = 'breathing-circle'; }
    
    const phaseEl = document.getElementById('breath-phase');
    const countEl = document.getElementById('breath-count');
    if (phaseEl) phaseEl.textContent = 'Great job!';
    if (countEl) countEl.textContent = '🌱';
    
    // Log session if > 30 seconds
    if (breathingSession >= 30) {
      try {
        const data = await api('/challenges/mindfulness', { method: 'POST', body: JSON.stringify({ session_type: breathingType, duration_seconds: breathingSession }) });
        showToast(data.message, 'success', '🧘');
        await fetchDashboard();
      } catch (err) {}
    }
    
    breathingSession = 0;
    const timerEl = document.getElementById('breath-timer');
    if (timerEl) timerEl.textContent = 'Session: 0s';
  }

      </div>
      
      <div class="three-col" style="margin-bottom:1.5rem">
        <div class="card" style="text-align:center">
          <div style="font-size:2.5rem;margin-bottom:0.5rem">🔥</div>
          <div style="font-family:'Space Grotesk';font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#FF6B9D,#FF8E53);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${d.stats.streak}</div>
          <div style="color:var(--text2);font-size:0.85rem">Current Streak</div>
        </div>
        <div class="card" style="text-align:center">
          <div style="font-size:2.5rem;margin-bottom:0.5rem">⭐</div>
          <div style="font-family:'Space Grotesk';font-size:2.5rem;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${d.stats.level}</div>
          <div style="color:var(--text2);font-size:0.85rem">Current Level</div>
        </div>
        <div class="card" style="text-align:center">
          <div style="font-size:2.5rem;margin-bottom:0.5rem">📝</div>
          <div style="font-family:'Space Grotesk';font-size:2.5rem;font-weight:800;background:var(--gradient2);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${d.stats.total_words_written}</div>
          <div style="color:var(--text2);font-size:0.85rem">Words Written</div>
        </div>
      </div>
      
      <div class="two-col" style="margin-bottom:1.5rem">
        <div class="card">
          <div class="section-title" style="margin-bottom:1rem">📈 30-Day Mood Trend</div>
          ${analytics ? renderMiniChart(analytics.entries) : '<div style="color:var(--text2)">Loading...</div>'}
          ${analytics ? `<div style="color:var(--text2);font-size:0.85rem;margin-top:0.75rem">Avg: ${Math.round((analytics.avg_mood||0)*10)/10}/10 over ${analytics.entries.length} days tracked</div>` : ''}
        </div>
        <div class="card">
          <div class="section-title" style="margin-bottom:1rem">🎯 Achievement Summary</div>
          <div style="display:grid;gap:0.75rem">
            ${[
              { icon: '😊', label: 'Total Mood Entries', value: d.stats.total_moods },
              { icon: '✍️', label: 'Journal Entries', value: d.stats.total_journal_entries },
              { icon: '🏆', label: 'Challenges Completed', value: d.stats.completed_challenges },
              { icon: '🧘', label: 'Mindfulness Minutes', value: d.stats.mindfulness_minutes },
              { icon: '⚡', label: 'Total XP Earned', value: d.stats.xp },
            ].map(s => `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:0.75rem;background:var(--bg2);border-radius:12px">
                <div style="display:flex;align-items:center;gap:0.75rem">
                  <span style="font-size:1.3rem">${s.icon}</span>
                  <span style="font-size:0.875rem;color:var(--text2)">${s.label}</span>
                </div>
                <span style="font-family:'Space Grotesk';font-weight:700;color:var(--primary-light)">${s.value}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="section-title" style="margin-bottom:1rem">🌱 Level Progress</div>
        <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1rem">
          <div style="text-align:center">
            <div style="font-size:2rem;font-weight:800;font-family:'Space Grotesk';color:var(--primary-light)">Lv.${d.stats.level}</div>
            <div style="font-size:0.8rem;color:var(--text2)">${getLevelTitle(d.stats.level)}</div>
          </div>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text2);margin-bottom:0.5rem">
              <span>${d.stats.xp} XP</span>
              <span>${d.stats.level * 200} XP to Lv.${d.stats.level + 1}</span>
            </div>
            <div class="progress-bar" style="height:12px">
              <div class="progress-fill" style="width:${d.stats.level_progress}%;height:12px"></div>
            </div>
            <div style="font-size:0.75rem;color:var(--text3);margin-top:0.4rem">${d.stats.xp_to_next_level} XP to next level</div>
          </div>
        </div>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
          ${['🌱 Seedling (Lv.1)', '🌿 Sprout (Lv.2)', '🌳 Sapling (Lv.3)', '🌲 Tree (Lv.4)', '⭐ Ancient Oak (Lv.5)', '🌌 Forest Guardian (Lv.6+)'].map((title, i) => `
            <span style="padding:0.3rem 0.7rem;border-radius:50px;font-size:0.75rem;${i < d.stats.level ? 'background:rgba(108,99,255,0.2);border:1px solid rgba(108,99,255,0.3);color:var(--primary-light)' : 'background:var(--bg2);color:var(--text3);border:1px solid var(--border)'}">${title}</span>
          `).join('')}
        </div>
      </div>
    `;
  }
  
  // ---- Leaderboard ----
  function renderLeaderboard() {
    const rankIcons = ['🥇', '🥈', '🥉'];
    return `
      <div class="page-header">
        <h1 class="page-title">Leaderboard 🏆</h1>
        <p class="page-subtitle">Top wellness champions in the MindBloom community</p>
      </div>
      <div class="card">
        ${state.leaderboard.length ? state.leaderboard.map((u, i) => `
          <div class="leaderboard-item ${u.is_current_user ? 'is-me' : ''}">
            <div class="leaderboard-rank ${i < 3 ? `rank-${i+1}` : ''}">${i < 3 ? rankIcons[i] : `#${i+1}`}</div>
            <div class="avatar">${getAvatarEmoji(u.avatar)}</div>
            <div class="leaderboard-info">
              <div class="leaderboard-name">${u.username}${u.is_current_user ? ' (You)' : ''}</div>
              <div class="leaderboard-stats">Lv.${u.level} ${getLevelTitle(u.level)} • 🔥${u.streak} streak</div>
            </div>
            <div class="leaderboard-xp">${u.xp} XP</div>
          </div>
        `).join('') : '<div class="empty-state"><div class="empty-state-text">Be the first on the leaderboard! 🌱</div></div>'}
      </div>
      <div style="margin-top:1rem;padding:1rem;background:var(--bg2);border-radius:16px;font-size:0.82rem;color:var(--text2)">
        💡 Earn XP by logging moods (20 XP), writing journal entries (15 XP), completing breathing exercises (5 XP/min), and finishing challenges!
      </div>
    `;
  }
  
  // ---- Navigation ----
  async function navigate(page) {
    state.currentPage = page;
    state.sidebarOpen = false;
    showJournalEditor = false;
    
    if (page === 'breathe') {
      stopBreathing().catch(() => {});
    }
    
    // Refresh data on navigate
    try {
      if (page === 'dashboard') await Promise.all([fetchDashboard(), fetchMoods(), fetchTodayMood()]);
      if (page === 'mood') await Promise.all([fetchMoods(), fetchTodayMood()]);
      if (page === 'journal') await fetchJournal();
      if (page === 'challenges') await fetchChallenges();
      if (page === 'leaderboard') await fetchLeaderboard();
    } catch (err) { showToast('Error loading data', 'error'); }
    
    if (page === 'stats') {
      renderApp(); // render first
      const el = document.getElementById('main-content');
      if (el) el.innerHTML = await renderStatsPage();
    } else {
      renderApp();
    }
  }
  
  // ---- Utility ----
  function getGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'morning';
    if (h < 17) return 'afternoon';
    return 'evening';
  }
  
  function getMoodGreetingEmoji(avg) {
    if (!avg) return '🌱';
    if (avg >= 8) return '🌟';
    if (avg >= 6) return '😊';
    if (avg >= 4) return '💙';
    return '🤗';
  }
  
  function getTodayDate() {
    return new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  
  function getDailyTip() {
    const tips = [
      "Your emotions are valid. Take a moment to acknowledge what you're feeling today without judgment.",
      "Small steps lead to big changes. You don't have to transform overnight — consistency is what matters most.",
      "Reach out to a friend or family member today. Connection is one of the most powerful wellness tools we have.",
      "Drink water, take a short walk, and breathe deeply. Sometimes the simplest actions have the biggest impact.",
      "Remember: it's okay to not be okay. Seeking help is a sign of strength, not weakness.",
      "Celebrate your wins, no matter how small. Did you get out of bed? That counts. Did you show up today? That counts too.",
      "Comparison is the thief of joy. Your journey is unique — focus on your own growth.",
      "Take 5 minutes today to do something just for yourself. You deserve care too.",
      "Gratitude practice: name 3 things you're thankful for right now. Start with the basics — air, warmth, this moment.",
      "Your mental health matters as much as your grades or achievements. Prioritize it every single day."
    ];
    return tips[new Date().getDate() % tips.length];
  }
  
  // ---- App Init ----
  async function initApp() {
    try {
      await Promise.all([fetchDashboard(), fetchMoods(), fetchTodayMood(), fetchChallenges()]);
      navigate('dashboard');
    } catch (err) {
      if (err.message.includes('401') || err.message.includes('token')) {
        state.token = null;
        localStorage.removeItem('mb_token');
        renderAuth();
      } else {
        navigate('dashboard');
      }
    }
  }
  
  async function checkAuth() {
    if (!state.token) { renderAuth(); return; }
    try {
      state.user = await api('/auth/profile');
      await initApp();
    } catch (err) {
      state.token = null;
      localStorage.removeItem('mb_token');
      renderAuth();
    }
  }
  
  // Start the app
  checkAuth();
  </script>
</body>
</html>
